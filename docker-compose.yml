# netwatch must run with host networking: in a bridge network it would probe
# Docker's NAT, not your LAN, and the gateway probe would point at the Docker
# bridge instead of your router. With network_mode: host its vantage point is
# identical to the host's.
#
#   docker compose up -d --build            # netwatch only
#   docker compose --profile ntfy up -d     # netwatch + a LAN ntfy server

services:
  netwatch:
    build: .
    image: netwatch
    container_name: netwatch
    network_mode: host
    restart: unless-stopped
    environment:
      # Configured via .env (copy .env.example). Set NETWATCH_NTFY_URL there to
      # push incident alerts to a LAN ntfy topic; blank disables push.
      NETWATCH_NTFY_URL: ${NETWATCH_NTFY_URL:-}
      NETWATCH_INTERVAL: ${NETWATCH_INTERVAL:-5}
    volumes:
      - ./data:/data:z

  # LAN dashboard: live status, incident browser, and remediation playbooks
  # matched to the failing-probe signature. Read-only view of the netwatch
  # data dir — point NETWATCH_DATA_DIR at wherever netwatch writes (the
  # systemd deployment uses ~/.local/share/netwatch; the compose one ./data).
  #
  #   docker compose up -d --build web
  web:
    build: ./web
    image: netwatch-web
    container_name: netwatch-web
    restart: unless-stopped
    ports:
      - "${NETWATCH_WEB_PORT:-8091}:8091"
    environment:
      NETWATCH_INTERVAL: ${NETWATCH_INTERVAL:-5}
      NETWATCH_WEB_IFACE: ${NETWATCH_WEB_IFACE:-}
      NETWATCH_WEB_LAN_DNS: ${NETWATCH_WEB_LAN_DNS:-}
    volumes:
      - ${NETWATCH_DATA_DIR:-./data}:/data:ro,z

  # Optional self-hosted push server for phone alerts (ntfy Android app with
  # "instant delivery" works fully offline-from-the-internet on your LAN).
  ntfy:
    image: binwiederhier/ntfy
    container_name: ntfy
    command: serve
    restart: unless-stopped
    ports:
      - "8090:80"
    environment:
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
    volumes:
      - ./ntfy-cache:/var/cache/ntfy:z
    profiles: [ntfy]
